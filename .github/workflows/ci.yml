name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx astro check
      - name: Retired kit class names
        run: npm run kit-names
      - name: Design-system audit (0 R-violations)
        run: npm run audit
      - name: Build
        run: npm run build

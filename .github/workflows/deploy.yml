name: deploy

# Builds the static site and mirrors dist/ to the CloudPanel "Static HTML Site"
# document root over rsync/SSH. Runs on every push to main, after a clean build
# + design-system audit. All connection details come from repo secrets.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Design-system audit (0 R-violations)
        run: npm run audit
      - name: Build
        run: npm run build
      - name: Deploy dist/ over rsync + SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          port="${SSH_PORT:-22}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$port" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # -rlvz (not -a): the doc root is group-owned by another CloudPanel
          # user, so setting dir/file times, perms or ownership is not permitted
          # and would fail the transfer. We only need the file contents mirrored.
          rsync -rlvz --delete --omit-dir-times --no-perms --no-owner --no-group \
            --exclude='.well-known/' \
            -e "ssh -i ~/.ssh/id_deploy -p $port -o StrictHostKeyChecking=yes" \
            dist/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"
